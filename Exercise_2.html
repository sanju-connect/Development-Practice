<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Multicolour Website</title>
    <style>
        :root {
            --primary-color: rgb(110, 54, 120);
            --text-color: white;
            --secondary-color: rgb(255, 0, 191);
        }

        *{
            margin: 0;
            padding: 0;
        }
        ul li {
            list-style: none;
            display: inline;
            padding: 23px;
            font-weight: bold;
        }
        ul li a {
            color: var(--text-color);
            text-decoration: none;
        }
        nav {
            background-color: var(--primary-color);
            padding: 12px 0;
        }
        body {
            background-color: var(--secondary-color);
        }
    </style>
</head>
<body>
    <header>
        <nav>
            <ul>
                <li><a href="/">Home</a></li>
                <li><a href="/">About</a></li>
                <li><a href="/">Services</a></li>
                <li><a href="/">Contact Us</a></li>
            </ul>
        </nav>
    </header>
</body>
</html>
